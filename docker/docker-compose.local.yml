version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8070 --reload
    ports:
      - "8070:8070"
    env_file:
      - ../.env.local
    volumes:
      - ..:/app
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: adtech
      MYSQL_USER: adtech
      MYSQL_PASSWORD: adtech
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:6
    ports:
      - "6379:6379"

volumes:
  mysql_data: