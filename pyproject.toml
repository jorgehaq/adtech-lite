[tool.poetry]
name = "adtech-lite"
version = "0.1.0"
description = "Adtech Lite - Multi-tenant Ad Analytics API"
authors = ["Jorge Alvarez <jorgehaq@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = "^0.30"
sqlalchemy = "^2.0"
alembic = "^1.13"
pymysql = "^1.1"
redis = "^5.0"
pydantic = "^2.9"
httpx = "^0.27"
aioredis = "^2.0.1"
cryptography = "^46.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
flake8 = "^7.0"
black = "^24.3"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"